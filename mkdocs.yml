site_name: Nursultan Internet Kit
site_description: Документация моста интернета для скриптов Nursultan
site_url: https://cloiss21011-code.github.io/nursultan-internet-kit/
repo_url: https://github.com/cloiss21011-code/nursultan-internet-kit
repo_name: nursultan-internet-kit

theme:
  name: material
  language: ru
  font: false
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - search.share

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Начало:
      - Что это: index.md
      - Установка: install.md
  - Разработка:
      - Протокол: protocol.md
      - API скрипта: api.md
      - Примеры: examples.md
      - Внутреннее устройство: architecture.md
      - Безопасность: security.md
  - Генерация:
      - Правила для ИИ: ai-rules.md
      - Рецепты API: recipes.md
  - Помощь:
      - Решение проблем: troubleshooting.md
      - Вопросы и ответы: faq.md
      - Журнал изменений: changelog.md
      - Карта сайта: sitemap.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cloiss21011-code/nursultan-internet-kit
      name: nursultan-internet-kit на GitHub
