name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сборка llms-full.txt
        run: python tools/make_llms.py

      - name: Установка MkDocs
        run: pip install mkdocs-material

      - name: Публикация на GitHub Pages
        run: mkdocs gh-deploy --force
